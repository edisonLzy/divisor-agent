appId: com.edisonlzy.divisor-agent
productName: Divisor Agent
icon: resources/icon.png
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
win:
  executableName: divisor-agent
  icon: resources/icon.png
nsis:
  artifactName: Divisor-Agent-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: resources/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  # electron-builder v26.8.1 on arm64 runners fails the lipo stage of
  # `--universal` with "packages/app not a file" — it tries to read the
  # working directory as the x64 input. Single-arch on macos-latest
  # (arm64) sidesteps the bug. Toggling back to --universal later requires
  # either an electron-builder upgrade or running macOS jobs on intel.
  artifactName: Divisor-Agent-${version}-${arch}.${ext}
dmg:
  artifactName: Divisor-Agent-${version}-${arch}.${ext}
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  maintainer: edisonLzy
  category: Utility
  # The package name `@divisor-agent/app` produces a default deb filename
  # `dist/@divisor-agent/app_0.0.x_amd64.deb`. fpm refuses `@` in the name
  # and electron-builder doesn't mkdir the parent directory. Pin a clean
  # explicit filename.
  artifactName: Divisor-Agent-${version}-${arch}.${ext}
appImage:
  artifactName: Divisor-Agent-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: edisonLzy
  repo: divisor-agent
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
